abstract: 目的探究围术期颊针疗法对高龄患者髋关节置换术后谵妄(POD)的影响。方法选择2024年1—10月择期全麻下行髋关节置换术的患者80例,男36例,女44例,年龄75~90岁,BMI 18.5~24.0
  kg/m2,ASAⅡ或Ⅲ级,采用随机数字表法将患者分为两组:颊针组和对照组,每组40例。对照组在全麻诱导前采用超声引导下髂筋膜间隙神经阻滞,颊针组于髂筋膜间隙神经阻滞麻醉前参照《颊针疗法》选穴进行颊针处理。记录术前1
  d、术后1、2、3 d的静息时VAS疼痛评分,术后7 d POD、恶心呕吐、头晕头痛发生情况,术前1 d、术后1 d白细胞介素-6(IL-6)、肿瘤坏死因子-α(TNF-α)、神经烯醇化酶(NSE)、S-100β蛋白浓度。结果与对照组比较,颊针组术后1、2、3
  d的静息时VAS疼痛评分明显降低(P<0.05),术后7 d内POD、恶心呕吐和头晕头痛发生率明显降低(P<0.05),术后1 d IL-6、TNF-α、NSE、S-100β蛋白浓度明显降低(P<0.05)。结论围术期颊针疗法可明显降低高龄患者髋关节置换POD的发生率,降低术后疼痛及炎症水平。
