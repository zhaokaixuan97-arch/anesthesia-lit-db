abstract: 颊针是王永洲教授及其团队发现的一种新型微针系统,即人体面颊部存在一人体整体的对应投影区域,通过在面颊部特定穴位针刺即可治疗全身疾病,具备安全、无痛、操作便捷及疗效显著四大优势。近年来,颊针的临床应用研究逐渐增多,其在解决多系统疑难疾病的治疗过程中具有较大的发展潜力与研究价值。现从颊针的理论起源与发展历程、效用机制及临床应用进展进行综述。
