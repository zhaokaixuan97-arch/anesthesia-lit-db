abstract: 目的探讨颊针联合瑞马唑仑应用于肥胖患者无痛胃肠镜检查中对患者检查指标、疼痛情况、生命体征及不良反应的影响。方法选取2023年6月至2024年6月连云港市中医院收治的接受无痛胃肠镜检查的肥胖患者80例,按照随机数字表法分为对照组(40例,瑞马唑仑麻醉)和观察组(40例,颊针联合瑞马唑仑麻醉)。比较两组患者单次检查完成情况、进镜时间,检查结束患者清醒后视觉模拟量表(VAS)疼痛评分,胃肠镜进入前和检查开始10
  min后的生命体征指标,以及检查期间的不良反应发生情况。结果检查完成后观察组患者单次检查完成率高于对照组,检查结束患者清醒后VAS疼痛评分低于对照组;观察组患者胃镜和肠镜进镜时间均短于对照组;与检查前比,检查开始10
  min后两组患者收缩压(SBP)、舒张压(DBP)、心率(HR)均升高,但观察组均低于对照组;检查期间观察组患者不良反应总发生率低于对照组(均P<0.05)。结论颊针联合瑞马唑仑用于肥胖患者无痛胃肠镜检查中可提高患者检查完成率,缩短检查用时,维持患者生命体征的稳定,并减轻患者检测后的疼痛感,且安全性较高。
