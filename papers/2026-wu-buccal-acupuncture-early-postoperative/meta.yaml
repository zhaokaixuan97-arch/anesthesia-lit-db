abstract: 'Purpose: To evaluate whether buccal acupuncture (BA), a minimally invasive facial acupuncture
  technique, reduces early postoperative catheter-related bladder discomfort (CRBD) after ureteroscopic
  lithotripsy (URSL). Patients and Methods: In this single-center, participant- and assessor-blinded,
  sham-controlled randomized trial, 118 patients undergoing URSL were randomized 1:1 to the BA group (n
  = 59) or sham group (n = 59). Baseline CRBD was assessed at extubation, followed by a 30-min PACU intervention.
  The BA group received needle insertion through guide tubes at bilateral Lower Jiao, Lumbar'
