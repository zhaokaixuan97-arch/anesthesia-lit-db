abstract: 背景与目的:老年结肠癌患者在接受腹腔镜根治术后常伴有睡眠质量下降,而良好的睡眠有助于术后快速康复。目前,临床上多采用药物干预改善术后睡眠问题,但常规药物治疗可能引发谵妄及成瘾等不良反应。为探索更安全有效的非药物干预手段,本研究评估颊针疗法联合超声引导下星状神经节阻滞(SGB)对术后睡眠质量的影响。方法:纳入2024年2月-8月在长沙市第四医院接受腹腔镜结肠癌根治术的60例老年患者,采用随机数字表法分为试验组和对照组,各30例。对照组采用SGB干预,试验组在此基础上联合应用颊针疗法。记录围手术期平均动脉压(MAP)、心率(HR)、术后视觉模拟评分(VAS)、匹兹堡睡眠质量指数(PSQI)及不良反应发生率。结果:两组患者的一般资料差异无统计学意义(均P>0.05)。试验组术中及术后HR、MAP明显低于对照组(均P0.05)。结论:颊针疗法联合SGB在老年结肠癌患者围手术期的应用,不仅能显著改善术后睡眠质量,减轻术后疼痛,还可降低不良反应发生率,是一种安全、有效的非药物干预手段,值得在临床推广应用。
