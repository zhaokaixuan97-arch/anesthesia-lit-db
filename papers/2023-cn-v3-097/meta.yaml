abstract: 目的:探讨发散式冲击波联合颊针疗法治疗颈型颈椎病的临床效果。方法:选取2021年9月至2022年6月就诊于贵州中医药大学第一附属医院的颈型颈椎病患者90例,随机分为发散式冲击波组(n=30)、颊针组(n=30)与发散式冲击波联合颊针组(n=30)。观察三组患者治疗前后视觉疼痛评分(VAS)、颈椎功能障碍指数(NDI)评分情况及疗效。结果:(1)VAS评分方面,发散式冲击波联合颊针组患者在第3周时间点VAS评分低于发散式冲击波组、颊针组,发散式冲击波联合颊针组患者在第6周时间点VAS评分低于发散式冲击波组,NDI评分方面,发散式冲击波联合颊针组患者在第3、6周时间点NDI评分低于发散式冲击波组、颊针组;(2)临床疗效方面,发散式冲击波联合颊针组与发散式冲击波组疗效差异有统计学意义(P<0.05)。结论:发散式冲击波联合颊针疗法治疗颈型颈椎病,不但可以改善即时及远期疼痛,还能改善颈部功能,提高颈型颈椎病患者的生活质量。
