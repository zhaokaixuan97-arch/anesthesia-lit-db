abstract: Hiccups often occur during painless gastroscopy and may interfere with the procedure. In this
  study, the authors evaluated the efficacy and safety of cheek acupuncture in relieving hiccup symptoms
  during gastroscopy. Eighty-four patients experiencing hiccups were randomly assigned to either a treatment
  group (receiving cheek acupuncture) or a control group (no intervention). The treatment group showed
  a significantly higher cessation rate of hiccups (33/42 versus 10/42, p<0.001) and a shorter time to
