  evaluate the clinical efficacy and safety profile of buccal acupuncture therapy when employed as an
  adjunct to epidural analgesia for labor pain management. Conducted at Wanzhou Maternal and Child Health
  Hospital between September 2023 and September 2024, the trial enrolled 100 full-term parturients undergoing
