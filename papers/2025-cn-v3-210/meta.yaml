abstract: 目的探讨颊针疗法治疗失眠心脾两虚证的临床效果。方法本研究共纳入88例失眠心脾两虚证患者,均于2023年1月至2025年2月在医院接受治疗,采用随机数字表法将其分为两组,观察组44例予以艾司唑仑片+颊针疗法治疗,对照组44例仅予以艾司唑仑片治疗。比较两组临床疗效、匹兹堡睡眠质量指数(PSQI)、中医证候积分(入睡困难、心悸不安、易醒、疲倦无力)及多导睡眠图指标,并通过监测不良反应发生情况进行安全性评估。结果观察组治疗总有效率高于对照组,治疗后中医证候积分(入睡困难、心悸不安、易醒、疲倦无力)、PSQI评分均低于对照组,多导睡眠图指标优于对照组(P0.05)。结论采用颊针疗法治疗失眠心脾两虚证效果显著,能有效改善患者睡眠质量,缓解临床症状,且安全性良好。
