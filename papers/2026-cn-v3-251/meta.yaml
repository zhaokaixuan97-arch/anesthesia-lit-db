abstract: 亚急性甲状腺炎(subacute thyroiditis,SAT)是一种常见的自限性甲状腺疾病,该病典型临床表现为发热、颈部疼痛及甲状腺功能异常,其病理生理机制涉及病毒等感染后引发的免疫炎症反应[1]。目前西医治疗主要依赖非甾体抗炎药和糖皮质激素,但长期使用可能带来一系列不良反应,且复发率较高[2]。因此,探索更安全有效的治疗方案具有重要临床意义。托里消毒散作为中医经典方剂,具有益气养血、托毒透脓之功效[3]。药理学研究表明,托里消毒散中的活性成分可通过调控炎症因子释放,在免疫炎症性疾病过程中产生积极影响[4-5]。
