abstract: 目的 探讨柴胡加龙骨牡蛎汤联合颊针疗法在广泛性焦虑症(GAD)(痰热内扰证)患者中的治疗效果。方法 86例GAD(痰热内扰证)患者,按随机数字表法分为对照组和观察组,各43例。两组均给予西医治疗,对照组行颊针疗法,观察组在对照组基础上加用柴胡加龙骨牡蛎汤。比较两组临床疗效、不良反应发生情况及治疗前后焦虑程度[汉密尔顿焦虑量表(HAMA)、焦虑自评量表(SAS)评分]、中医证候积分、血清学指标[5-羟色胺(5-HT)、P物质(SP)、多巴胺(DA)、去甲肾上腺素(NE)]。结果
  观察组治疗总有效率为95.35%,高于对照组的81.40%(P0.05)。结论 柴胡加龙骨牡蛎汤联合颊针疗法可以增强GAD(痰热内扰证)的治疗效果,减轻焦虑程度,改善血清学指标,安全有效。
