abstract: 目的探究颊针疗法在老年肩关节脱位患者手法复位术中的镇痛效果。方法将60例拟行肩关节脱位手法复位的老年患者随机分为颊针组和对照组,每组30例。颊针组患者于进入手术室后接受颊针疗法,对照组不接受颊针治疗,均于5
  min后实施静脉麻醉。监测患者在入室时(T0)、静脉注射前(T1)、复位时(T2)及复位成功后(T3)的血压、心率以及血氧饱和度(SpO2)。记录患者T0、T1、T3时的视觉模拟评分(VAS)以及T2时的麻醉效果。对比患者在复位过程中丙泊酚和瑞芬太尼的用量、复位时间、苏醒时间、恢复室停留时间以及不良反应的发生情况。结果与对照组相比,颊针组在T1的收缩压、舒张压和心率显著降低(t=-3.792、-3.816、-3.256,P<0.001、<0.001、=0.002);与颊针组比较,对照组患者在T2和T3时的收缩压和舒张压显著降低(t=2.092、2.378、2.116、2.146,P=0.041、0.021、0.039、0.036)。与对照组相比,颊针组在T1、T3时VAS评分明显下降(Z=-6.240、-4.563,P<0.001);T2颊针组麻醉效果明显优于对照组(χ2=7.72,P=0.04)。与对照组相比,颊针组在丙泊酚和瑞芬太尼总用量、复位时间、苏醒时间、恢复室停留时间均显著缩短,术后恶心呕吐及呼吸抑制发生率显著降低(Z=-6.201、-6.803、-4.246、-5.
