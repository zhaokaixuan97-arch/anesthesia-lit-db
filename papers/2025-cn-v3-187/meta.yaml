abstract: 目的观察帕洛诺司琼配合颊针疗法对腹腔镜术后恶心呕吐的防治效果。方法纳入医院2022年6月至2024年6月收治的125例腹腔镜手术患者为研究对象,随机分为常规组(62例)和颊针组(63例)。常规组采用帕洛诺司琼治疗,颊针组采用帕洛诺司琼配合颊针疗法治疗,比较两组胃肠道平滑肌收缩频率、收缩幅度、慢波电位、动作电位、身心状态[Kolcaba主观舒适状况量表(GCQ)、恶心呕吐干呕症状评估量表(INVR)评分]、恶心呕吐发生率及不良反应发生情况。结果颊针组胃肠道平滑肌收缩频率、收缩幅度、慢波电位及动作电位均低于常规组(P0.05)。结论帕洛诺司琼配合颊针疗法能有效改善腹腔镜手术患者胃肠道平滑肌功能与身心状态,降低术后恶心呕吐发生率,且安全性较高。
