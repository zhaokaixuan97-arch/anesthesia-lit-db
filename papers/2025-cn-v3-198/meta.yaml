abstract: 目的:评价颊针及颊针联合昂丹司琼在女性患者腹腔镜胆囊切除术的使用效果。方法:将腹腔镜下胆囊切除术的女性患者98例随机分为昂丹司琼组(A组)、颊针组(B组)和颊针联合昂丹司琼组(C组),观察术后24小时中重度疼痛发生率、术后恶心呕吐发生率、视觉模拟评分(VAS)、麻醉药物用量、术后补救镇痛和止吐药物使用情况、围手术期不良事件发生率、首次排气时间和术后出院时间。结果:术后0~24小时中重度疼痛发生率分别为A组40.6%、B组11.8%、C组12.5%,B组、C组与A组相比差异有统计学意义(P
  = 0.007, P = 0.011)。三组术后6~12小时的VAS评分差异有统计学意义(P = 0.000)。术后补救性镇痛药物使用率,A组、B组、C组分别为28.1%,2.9%,9.4%,B组与A组存在统计学差异(P
  = 0.005)。A组、B组、C组术后0~24小时PONV发生率分别为34.4%、14.7%和31.3%,组间无统计学差异(P = 0.148)。结论:颊针或颊针联合昂丹司琼均可有效降低女性患者腹腔镜胆囊切除术术后中重度疼痛的发生率,颊针而非颊针联合昂丹司琼具有更低的术后补救镇痛药物使用率;颊针联合昂丹司琼在降低PONV发生率方面并不优于颊针。
