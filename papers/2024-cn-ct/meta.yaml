abstract: 目的 观察颊针联合CT引导下脉冲射频治疗急性期带状疱疹神经痛的临床疗效。方法 将100例急性期带状疱疹神经痛患者随机分为观察组与对照组各50例,对照组采用基础药物治疗配合CT引导下脉冲射频治疗,观察组在对照组基础上联合颊针治疗,观察并记录两组患者视觉模拟量表(VAS)评分,匹兹堡睡眠质量指数(PSQI)评分、血清中P物质(SP)水平、Th1/Th2细胞因子水平和患者发展为后遗留神经痛的例数。结果
  治疗后两组患者VAS评分均低于治疗前,且观察组优于对照组(P <0.05)。两组患者的PSQI评分均低于治疗前,且观察组优于对照组(P <0.05)。治疗后两组患者SP水平明显低于治疗前,且观察组优于对照组(P
  <0.05)。两组患者干扰素-γ(IFN-γ)水平明显高于治疗前,且观察组优于治疗组(P <0.05),两组患者白细胞介素-4(IL-4)、白细胞介素-10(IL-10)水平明显低于治疗前,且观察组优于治疗组(P
  <0.05)。观察组发展成后遗神经痛的患者例数明显少于对照组(P <0.05)。结论 颊针联合CT引导下脉冲射频治疗急性期带状疱疹神经痛疗效显著,安全性高,能有效缓解疼痛,改善睡眠质量,减少后遗神经痛发生的概率。
