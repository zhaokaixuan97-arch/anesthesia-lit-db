abstract: 'PURPOSE: Emergence delirium and postoperative negative behavioral changes (PNBC) are common
  complications in pediatric anesthesia. This study evaluated whether intranasal premedication combining
  dexmedetomidine and esketamine more effectively reduces these complications compared to either drug
  alone in children undergoing tonsillectomy and/or adenoidectomy with sevoflurane anesthesia.

  PATIENTS AND METHODS: This randomized, double-blind trial involved 198 children aged 2-5 years undergoing
  tonsillectomy and/or adenoidectomy. Participants received intranasal premedication with either dexmedetomidine
  (2 μg/kg), esketamine (1 mg/kg), or their combination (dexmedetomidine 1 μg/kg plus esketamine 0.5 mg/kg).
  The primary outcome was the incidence of emergence delirium, defined as a Pediatric Anesthesia Emergence
  Delirium (PAED) scale score ≥ 10. Secondary outcomes included the incidence of PNBC, sedation depth,
  easiness of separation from parents, acceptance of the mask for induction, emergence time, postoperative
  pain score, parental satisfaction, and adverse events.

  RESULTS: The combination premedication significantly reduced emergence delirium incidence (9.4%) compared
  to esketamine alone (38.1%; relative risk [RR] 0.25, 95% confidence interval [CI] 0.11-0.57, p < 0.001),
  but not compared to dexmedetomidine alone (17.2%; RR 0.55, 95% CI 0.21-1.39, p = 0.193). PNBC incidence
  at day 7 was lower with the combination (28.1%) versus dexmedetomidine (48.4%; RR 0.58, 95% CI 0.36-0.93,
  p = 0.018), but not significantly different from esketamine alone (20.6%; RR 1.38, 95% CI 0.74-2.58,
  p = 0.326). The combination also provided significantly superior sedation, improved ease of separation
  from parents, better acceptance of the mask for induction, shorter emergence time, and higher parental
  satisfaction than both monotherapies.

  CONCLUSION: In children undergoing tonsillectomy and/or adenoidectomy with sevoflurane anesthesia, intranasal
  dexmedetomidine-esketamine premedication more effectively reduces emergence delirium compared to esketamine
  alone and PNBC compared to dexmedetomidine alone. This combination also improves sedation, shortens
  emergence times, and enhances parental satisfaction compared to monotherapy without significant adverse
  effects.

  TRIAL REGISTRATION: The Chinese Clinical Trial Registry, ChiCTR2300076709.'
