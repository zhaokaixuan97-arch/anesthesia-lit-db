abstract: 目的:探讨颊针针刺镇痛在髋部骨折手术患者麻醉前镇痛的临床效果。方法:招募因髋部骨折需要手术治疗的53例患者,随机分为对照组(27例)和颊针组(26例)。颊针组通过西医解剖和中医全息理论并参照取穴,对所取穴位进行消毒拍针、观察疗效、纠错、留针、取针,然后进行常规的椎管内麻醉(腰麻或腰硬联合麻醉)。对照组直接进行常规的椎管内麻醉,不予以颊针治疗。主要观察并比较两组间以下时间点的疼痛评分(视觉模拟疼痛评分,VAS):入室即刻(T1)、换床即刻(T2)、摆放麻醉操作体位即刻(T3),同时记录各时点SBP、DBP、HR、SpO2的变化。结果:两组患者组间比较在T1时SBP、DBP、HR、VAS差异均无统计学意义(P>0.05)。在T2、T3时SBP、DBP、HR、VAS差异均有统计学意义(P0.05)。结论:颊针针刺镇痛在髋部骨折手术患者的麻醉前可以提供很好的镇痛效果,减少患者麻醉前痛苦和心血管系统应激反应。
