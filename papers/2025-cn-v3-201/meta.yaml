abstract: 颊针疗法是新型特色的微针疗法,因其取穴方便、镇痛迅速、安全性高、简单易学、疗效广泛等优点,近年来已广泛应用于临床,在疼痛治疗和其他多种疾病的治疗方面效果显著。颊针疗法在围手术期的应用可以降低外科手术引起的急性疼痛,减少患者术后并发症发生率,有利于改善患者预后。此外,颊针疗法还在颈椎病、腰部疾病、肩关节疾病、头痛、痛经、失眠、心血管系统疾病、放化疗不良反应治疗方面有广泛应用,并取得了较好的临床效果。
