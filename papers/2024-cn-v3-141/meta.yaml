abstract: 目的:观察颊针治疗慢性非特异性腰背痛(CNLBP)患者的效果及对疼痛程度的影响。方法:选择2022年10月—2023年10月日照市人民医院中医科就诊的170例CNLBP患者为研究对象(n=57),随机将其分为颊针组(n=55)、常规针刺组和西药对照组(n=58)。西药对照组采用塞来昔布胶囊口服治疗,颊针组采用颊针治疗,常规针刺组采用常规针刺治疗。比较两组疼痛程度和治疗效果。结果:治疗后,颊针组简化McGill量表中疼痛评级指数、疼痛视觉模拟评分、现时疼痛强度评分及整体总分均低于常规针刺组和西药对照组,差异均有统计学意义(P0.05)。结论:颊针治疗CNLBP疗效确切,能够改善患者疼痛症状,提高临床疗效,且安全性尚佳。
