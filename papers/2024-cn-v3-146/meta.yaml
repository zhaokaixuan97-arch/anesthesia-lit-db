abstract: 目的观察颊针疗法对全髋关节置换老年患者术后疼痛及认知功能的影响。方法选取拟行全髋关节置换术的老年患者80例,随机分为观察组和对照组,每组40例。两组均给予腰硬联合麻醉,观察组麻醉成功后给予颊针疗法,针刺得气后留针30
  min,对照组麻醉成功后安静休息30 min,两组均行全髋关节置换术。记录两组术前1天(T0)、术后12 h(T1)、术后24 h(T2)、术后48 h(T3)、术后72 h(T4)的静息和活动状态疼痛视觉模拟评分(VAS)、简易精神状态量表(MMSE)评分和蒙特利尔认知评估量表(MoCA)评分,采用化学发光法检测两组T0、T1时间点血清C反应蛋白(CRP)、神经元特异性烯醇化酶(NSE),记录两组术后并发症发生情况。结果T1、T2、T3时间点观察组静息、运动状态VAS均低于对照组而MMSE、MoCA评分均高于对照组(P均0.05)。与同组T0时间点比较,两组T1时间点血清CRP、NSE水平均升高,且对照组升高更明显(P均<0.05)。观察组术后发生尿潴留1例、恶心呕吐2例,并发症发生率为7.5%(3/40);对照组分别为4、6例及25%(10/40);两组比较P<0.05。结论颊针疗法有助于减轻全髋关节置换老年患者术后疼痛及炎症反应,从而促进其术后认知功能的恢复,且安全性较高。
