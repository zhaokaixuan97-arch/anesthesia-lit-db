abstract: 目的 分析颊针联合右美托咪定对腰椎全身麻醉(全麻)术后谵妄及恢复质量的影响。方法 320例全麻下进行腰椎手术的患者,随机分为空白对照组(不进行干预)、颊针组(单独给予颊针干预)、右美托咪定组(单独给予右美托咪定)以及颊针联合右美托咪定组(联合组,给予颊针+右美托咪定),各80例。比较四组患者神经元特异性烯醇化酶(NSE)、炎症指标、应激指标、疼痛程度、睡眠质量、术后谵妄发生情况。结果
  手术后第1天,空白对照组NSE水平与手术前1 d比较,没有显著差异(P>0.05);手术后第3天,空白对照组NSE水平较手术前1 d升高,差异显著(P0.05);颊针组、右美托咪定组、联合组VAS评分均较手术后第1天降低,且联合组VAS评分显著低于空白对照组、颊针组、右美托咪定组,差异显著(P0.05);颊针组、右美托咪定组、联合组PSQI评分均较手术前1
  d降低,且联合组PSQI评分显著低于空白对照组、颊针组、右美托咪定组,差异显著(P<0.05)。空白对照组、颊针组、右美托咪定组、联合组术后谵妄发生率分别为16.25%、8.75%、6.25%、5.00%,联合组术后谵妄发生率较空白对照组低,差异显著(P<0.05)。结论
  颊针联合右美托咪定可降低腰椎全麻术后谵妄发生率,术后恢复质量较佳。
