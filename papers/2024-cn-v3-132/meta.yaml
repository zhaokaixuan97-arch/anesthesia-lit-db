abstract: 目的:探讨剖宫产术后颊针疗法应用效果观察。方法:选择2022年1月至2023年12月医院剖宫产产妇50例,按数字表随机分组。对照组(n=25)术后采用静脉自控镇痛,观察组(n=25)再联合颊针疗法,对两组术后疼痛、产后恢复、不良反应进行比较。结果:观察组术后6h、12h、24h、48h时疼痛评分(4.12±1.53)分、(3.81±1.34)分、(3.08±0.83)分、(1.43±0.54)分,分别较对照组的低(P<0.05)。观察组术后24h、48hQoR-15量表评分(122.81±11.82)分、(129.47±11.57)分,较对照组的高(P<0.05)。观察组术后不良反应发生率8.00%,较对照组32.00%的低(P<0.05)。结论:剖宫产术后采用颊针疗法,能够显著减轻产妇术后疼痛程度,降低恶心呕吐等不良反应,加快产妇产后康复进程。
