abstract: 'BACKGROUND: Postoperative pain and sleep disturbance are common after endoscopic sinus surgery
  (ESS) and may delay postoperative recovery. Acupuncture has demonstrated analgesic and sleep-enhancing
  effects in perioperative care; however, the impact of cheek acupuncture-a minimally invasive facial
  microsystem technique-on postoperative recovery after ESS has not been evaluated in randomized controlled
  trials. METHODS: This single-center, prospective, randomized controlled pilot trial will enroll 90 adults
