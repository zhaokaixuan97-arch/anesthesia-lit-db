abstract: 目的评价颊针疗法治疗神经根型颈椎病(CSR)的临床效果及优势。方法将2024年1月至2025年6月就诊于陶然亭社区卫生服务中心及下属3个社区卫生服务站中医门诊的66例神经根型颈椎病患者,依据随机数字表法分为颊针组与对照组,每组33例。颊针组针刺患侧颈穴、背穴,再根据全息反应点选择1~2个进针点。对照组予常规取穴针刺。观察两组患者治疗前后VAS、NDI及田中靖久量表评分差异。结果重复测量方差分析显示,随着治疗推进,两组VAS评分呈持续下降的变化趋势(F值时间=176.350,P值时间0.05)。结论颊针疗法疗效确切,对CSR症状有明显缓解作用,提升工作和生活能力。且不要求固定体位,不受衣物及周边环境的影响,操作十分方便,易于患者治疗。
