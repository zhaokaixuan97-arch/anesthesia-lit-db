abstract: 目的探讨围术期颊针疗法对剖宫产产妇术后镇痛效果与安全性的影响。方法选择择期行剖宫产产妇,产次≤3次,年龄20~40岁,BMI 18.5~40.0 kg/m2,ASAⅡ或Ⅲ级。采用随机数字表法将产妇分为两组:对照组和颊针组。颊针组在手术结束前30
  min、术后第1天和第2天分别行颊针治疗,留针30 min。对照组不行颊针治疗。术毕两组产妇均通过硬膜外导管给予0.2%罗哌卡因8 ml,术后采用布托啡诺及曲马多行患者自控静脉镇痛(PCIA)。若30
  min内按压镇痛泵2次后VAS疼痛评分>3分,则采用双氯芬酸钠栓补救镇痛。主要指标为术后阿片类药物用量,即术后吗啡毫克当量(MME)总用量。次要指标包括镇痛泵有效按压次数和总按压次数,补救镇痛率及镇痛满意度,术后6、12、24、48
  h静息时切口痛、活动时切口痛和宫缩痛的VAS疼痛评分,术后首次下床活动时间、首次肛门排气时间、拔除尿管后首次排尿时间。结果本研究共纳入产妇93例,对照组47例,颊针组46例。与对照组比较,颊针组术后MME总用量明显减少,镇痛泵有效按压次数和总按压次数明显减少,术后补救镇痛率明显降低,镇痛满意度明显升高,术后24
  h静息切口痛VAS疼痛评分明显降低,术后24、48 h活动切口痛、宫缩痛的VAS疼痛评分明显降低,术后首次下床活动时间、首次肛门排气时间、拔除尿管后首次排尿时间明显缩短(P<0.05)。结论围术期颊针疗法
