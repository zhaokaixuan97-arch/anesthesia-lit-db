abstract: 目的探讨常规制式镇痛辅助颊针治疗院前急性腹痛的临床效果,为院前急救镇痛方案的优化提供参考。方法选取2023年1月至2024年12月在我院急诊接受院前治疗的120例急性腹痛患者作为研究对象,按随机数字表法将其分为对照组与观察组,每组60例。两组患者均进行常规治疗,对照组采用常规制式镇痛(肌内注射酮咯酸氨丁三醇、氢溴酸山莨菪碱),观察组在对照组基础上实施颊针治疗。比较两组的临床疗效、疼痛程度及不良事件发生情况。结果观察组的治疗总有效率为91.67%,高于对照组的78.33%,差异具有统计学意义(P0.05);治疗后15、30
  min,两组的VAS评分低于治疗前,且观察组低于对照组,差异具有统计学意义(P<0.05)。观察组的不良事件总发生率为5.00%,低于对照组的18.33%,差异具有统计学意义(P<0.05)。结论常规制式镇痛辅助颊针治疗院前急性腹痛起效迅速,且治疗效果较好,安全性高,具有较高的临床推广价值。
