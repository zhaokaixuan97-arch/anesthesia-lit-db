abstract: 目的探讨颊针疗法对肋间神经痛患者的临床疗效。方法选取2022年1月至2024年5月北京和睦家医院肋间神经痛患者36例。选取病变侧背穴进行针刺,根据患者疼痛缓解程度调整进针深度和角度,直至患者疼痛消失或明显缓解,留针30
  min后拔除。每次就诊后第3日进行随访,随访发现疼痛改善≤70%的患者继续安排颊针治疗,疼痛改善>70%的患者则于第7日再次进行随访。观察患者的疼痛情况、临床疗效、治疗时间、用药情况及不良反应。结果36例肋间神经痛患者中,男15例,女21例,年龄24~87岁,平均(51.3±17.6)岁,左侧疼痛24例,右侧疼痛12例。36例患者患侧疼痛区域对应的胸椎旁或(和)肋间神经走行区压痛明显,经过施针、调针、留针后,患者疼痛均明显缓解。其中,22例患者治疗1次,8例治疗2次,4例治疗3次,1例治疗4次,1例治疗6次。36例患者治疗结束后,无效2例、可效5例、良效10例、优效19例,有效率为94.4%。2例颊针治疗无效患者中,1例经胸部CT诊断肺癌,1例经正电子发射计算机断层显像-计算机断层扫描提示胸壁转移病灶。36例患者均未发生明显不良反应。结论颊针疗法可用于治疗肋间神经痛,且快速、安全、微创,治疗效果明确。当治疗效果不满意时,需排除其他病变的可能。
