title: 'Esketamine Nasal Spray for Rapid Reduction of Depressive Symptoms in Patients With Major Depressive
  Disorder Who Have Active Suicide Ideation With Intent: Results of a Phase 3, Double-Blind, Randomized
  Study (ASPIRE II)'
