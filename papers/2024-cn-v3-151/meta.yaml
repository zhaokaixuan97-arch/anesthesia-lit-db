abstract: 颊针是一种新型微针疗法,临床镇痛效果显著。围术期多使用阿片类药物镇痛,联合运用颊针疗法可减少阿片类药物用量和不良反应发生率。本文通过对近几年来颊针应用于围术期镇痛的临床研究文献进行梳理,从颊针疗法的起源、理论体系、镇痛机制及临床研究应用等方面进行综述,为颊针在围术期的临床应用和研究提供参考。
