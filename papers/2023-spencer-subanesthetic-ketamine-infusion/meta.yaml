abstract: Traumatic brain injury (TBI) affects millions of people annually, and most cases are classified
  as mild TBI (mTBI). Ketamine is a potent trauma analgesic and anesthetic with anti-inflammatory properties.
  However, ketamine's effects on post-mTBI outcomes are not well characterized. For the current study,
  we used the Closed-Head Impact Model of Engineered Rotational Acceleration (CHIMERA), which replicates
  the biomechanics of a closed-head impact with resulting free head movement. Adult male Sprague-Dawley
  rats sustained a single-session, repeated-impacts CHIMERA injury. An hour after the injury, rats received
  an intravenous ketamine infusion (0, 10, or 20 mg/kg, 2 h period), during which locomotor activity was
  monitored. Catheter blood samples were collected at 1, 3, 5, and 24 h after the CHIMERA injury for plasma
  cytokine assays. Behavioral assays were conducted on post-injury days (PID) 1 to 4 and included rotarod,
  locomotor activity, acoustic startle reflex (ASR), and pre-pulse inhibition (PPI). Brain tissue samples
  were collected at PID 4 and processed for GFAP (astrocytes), Iba-1 (microglia), and silver staining
  (axonal injury). Ketamine dose-dependently altered locomotor activity during the infusion and reduced
  KC/GRO, TNF-α, and IL-1β levels after the infusion. CHIMERA produced a delayed deficit in rotarod performance
  (PID 3) and significant axonal damage in the optic tract (PID 4), without significant changes in other
  behavioral or histological measures. Notably, subanesthetic doses of intravenous ketamine infusion after
  mTBI did not produce adverse effects on behavioral outcomes in PID 1-4 or neuroinflammation on PID 4.
  A further study is warranted to thoroughly investigate beneficial effects of IV ketamine on mTBI given
  multi-modal properties of ketamine in traumatic injury and stress.
