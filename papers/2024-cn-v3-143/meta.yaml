abstract: 目的探讨颊针疗法在临床应用文献的特点。方法检索中国生物医学文献数据库、中国知网、万方医学数据库、Web of Science和PubMed数据库中2000年1月至2023年4月发表的颊针疗法相关文献。根据纳入和排除标准筛选以构建文献数据库,提取文献标题、第一作者、发表期刊、期刊因子等信息,初步总结此类文献的差异。结果共检索到颊针疗法文献210篇,按标准确定57篇文献,含中文55篇、英文2篇。纳入文献中《中国针灸》发文量最多(4篇,占7.01%);《中国针灸》影响因子最高,为3.185。文献第一作者均来自中国,所属机构中以甘肃中医药大学发文量最多(8篇,占14.04%)。共33篇文献被引用,被引频次总计339次,篇均被引5.95次。共有28篇接受基金资助(49.12%)。所纳入文献涉及42种不同疾病,其中颈椎病、肩关节周围炎、偏头痛、骨折等排名前列。所纳入文献观察指标最多9项,篇均指标数3.12项。文献图表总数最多16个,占比最大的是2~5个图表,合计42篇,占73.68%。结论颊针疗法临床应用文献主要为中文文献,作者均来自中国;获得的57篇文献分布于42个期刊,文献的期刊分布比较分散。颊针疗法获得基金资助的研究未超过半数;大多数文献用图表展示研究内容和结果,但文献中图的数量要远小于表的数量。
