abstract: 选择我院一定数量的样本数据展开分组对比实验以验证颊针疗法结合瑶药穴位贴敷治疗心脾两虚型失眠的临床具体疗效。方法 在我院2023年10月至2024年11月期间门诊接诊的心脾两虚型失眠患者中,随机选取60例作为研究对象,使用随机数字表法将其分为对照组(30例)和研究组(30例)。其中对照组采用传统针灸+瑶药穴位贴敷进行治疗,而研究组采取颊针+瑶药穴位贴敷进行治疗,在治疗10次后,对比分析两组患者的临床疗效、不良反应发生率以及睡眠改善情况。结果显示,研究组患者的不良反应率低于对照组,同时在临床疗效和睡眠质量改善等方面均显著优于对照组(P<0.05)。结论
  针对心脾两虚型失眠的治疗,使用颊针疗法结合瑶药穴位贴敷方法有着良好的疗效,且不良反应情况较少,值得在临床中推广与使用。
