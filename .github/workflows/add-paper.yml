name: 添加文献

# 任何人在仓库里用「添加文献」表单提交 Issue，都会触发这个机器人：
#   解析 DOI/PMID → PubMed 抓题录 → 写入 papers/ → 重建索引与网页 → 提交 → 回复并关闭 Issue
#
# 安全：只信任严格校验过的 DOI/PMID；备注不写入仓库；写入后跑 validate.py，红线告警即回滚。

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-paper-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, '添加文献')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install --quiet pyyaml requests

      - name: 解析 Issue 并入库
        id: add
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/add_from_issue.py

      - name: 读取仓库体积（用于容量仪表盘）
        if: steps.add.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: echo "REPO_SIZE_KB=$(gh api "repos/$REPO" --jq .size || echo 0)" >> "$GITHUB_ENV"

      - name: 重建索引与网页
        if: steps.add.outcome == 'success'
        run: |
          python scripts/build_index.py
          python scripts/build_web.py

      - name: 提交
        if: steps.add.outcome == 'success'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "文献入库 #${ISSUE_NUMBER}"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: 回复并关闭 Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f .issue-result.md ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file .issue-result.md
          else
            gh issue comment "$ISSUE_NUMBER" --body "机器人没能生成处理结果，请检查 Issue 内容或联系维护者。"
          fi
          gh issue close "$ISSUE_NUMBER"
