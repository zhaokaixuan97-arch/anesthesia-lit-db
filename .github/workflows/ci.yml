name: 校验并重建索引

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'papers/**'
      - 'schema/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  validate:
    name: 校验文献库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install --quiet pyyaml requests
      - name: 结构与隐私校验
        run: python scripts/validate.py
      - name: 试构建索引与网页（确保能跑通）
        run: |
          python scripts/build_index.py
          python scripts/build_web.py

  rebuild-index:
    name: 重建索引并提交
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install --quiet pyyaml
      - name: 重建索引与单文件网页
        run: |
          python scripts/build_index.py
          python scripts/build_web.py
      - name: 提交生成物（如有变化）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.html dist
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 重建索引与单文件网页 [skip ci]"
            git push
          fi
